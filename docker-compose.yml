services:
  db:
    image: postgres:17-alpine
    env_file: backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sem `ports`: o banco só é alcançável pelo backend, na rede interna.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    depends_on:
      db:
        condition: service_healthy
    # O schema é aplicado pelo Alembic a cada subida, antes de servir: se a
    # migração falhar, o backend não sobe (em vez de servir com schema velho).
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Injetado no bundle: "/api" é proxiado pelo nginx para o backend.
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
