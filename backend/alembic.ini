# Alembic: histórico versionado do schema do banco (docs/governanca_dados.md).
# A URL do banco NÃO fica aqui -- migrations/env.py a lê de
# app.core.config.DATABASE_URL, a mesma que a aplicação usa.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Nome do arquivo de revisão: data + slug, pra ordem cronológica legível.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
