# Serve o bundle do Vite e faz proxy de /api para o backend na rede do compose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/alunos -> http://backend:8000/alunos (mesma origem: sem CORS)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 110m;
    }

    # SPA: qualquer rota (/polo/..., /aluno/...) cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
